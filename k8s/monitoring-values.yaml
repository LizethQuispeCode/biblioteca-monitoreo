# Configuracion propia de kube-prometheus-stack

grafana:
  # CAMBIA esta contrasena por la tuya
  adminPassword: "Grafana2026"
  service:
    type: NodePort
    nodePort: 30300

prometheus:
  service:
    type: NodePort
    nodePort: 30900
  prometheusSpec:
    # Buscar ServiceMonitors / PodMonitors / PrometheusRules en TODOS los namespaces
    # (sin esto, Prometheus solo ve los recursos con el label del release de Helm)
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

alertmanager:
  service:
    type: NodePort
    nodePort: 30903

# Componentes que en Minikube dan problemas o targets en DOWN (no los necesitamos)
nodeExporter:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false