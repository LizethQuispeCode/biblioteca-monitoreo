server.port=8082
spring.application.name=prestamos-service

# Actuator: exponer SOLO prometheus, publicado en /metrics
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.path-mapping.prometheus=metrics
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=prestamos-service

# Conexion al Servicio A (se sobreescribe con variables de entorno en Kubernetes)
catalogo.url=${CATALOGO_URL:http://localhost:8081}
catalogo.timeout-ms=${CATALOGO_TIMEOUT_MS:2000}