server.port=8081
spring.application.name=catalogo-libros-service

# Actuator: exponer SOLO prometheus, publicado en /metrics
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.path-mapping.prometheus=metrics
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=catalogo-libros-service

# Delay artificial (casuistica 2). Se controla con la variable de entorno CATALOGO_DELAY_MS
catalogo.delay-ms=${CATALOGO_DELAY_MS:0}